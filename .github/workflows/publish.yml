name: Publish Kaziyami Release & Repository

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: publish-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Generate Original Adaptive PNG Icons
        run: python tools/generate_icons.py

      - name: Build and Sign Extension APKs
        env:
          KAZIYAMI_KEYSTORE_B64: ${{ secrets.KAZIYAMI_KEYSTORE_B64 }}
          KAZIYAMI_KEYSTORE_PASSWORD: ${{ secrets.KAZIYAMI_KEYSTORE_PASSWORD }}
          KAZIYAMI_KEY_ALIAS: ${{ secrets.KAZIYAMI_KEY_ALIAS }}
          KAZIYAMI_KEY_PASSWORD: ${{ secrets.KAZIYAMI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Deploy Repository Assets to repo Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: repo
          folder: repo
          single-commit: true
          commit-message: "deploy: publish Kaziyami extension release [skip ci]"

      - name: Create GitHub Release for Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            repo/apk/*.apk
            repo/sha256sums.txt
            repo/index.json
            repo/index.min.json
            repo/repo.json
          generate_release_notes: true
