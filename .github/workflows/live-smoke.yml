name: Scheduled Live Smoke Tests

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 04:00 UTC
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Live Smoke Tests
        id: live_test
        run: ./gradlew liveSmokeTest --continue

      - name: Open Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly Live Smoke Test Failure: NSFW Sources Need Attention',
              body: 'Automated weekly live smoke test detected broken streams or unreachable domains. Please review recent workflow logs and update working mirrors in `docs/SOURCES.md` and source configs.'
            })
