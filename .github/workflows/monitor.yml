name: Scheduled Structure Monitor

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Source Structure Monitor
        run: python tools/monitor_sources.py

      - name: Upload Structure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: structure-report
          path: reports/structure_report.json
