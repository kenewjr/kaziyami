name: Bump Versions & Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: 'Changelog summary for this release bump'
        required: false
        default: 'Routine extension maintenance and selector resilience update'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run bumpChanged
        run: |
          python tools/bump_changed.py --bump

      - name: Create Release Branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="bump/release-run-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          git add src/ CHANGELOG.md || true
          if git diff --staged --quiet; then
            echo "No version changes detected."
            exit 0
          fi

          git commit -m "chore(release): bump extVersionCode for affected sources"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "chore(release): bump extension versions" \
            --body "Automated version bump prepared via \`bump-and-release\` workflow.

### Note:
${{ inputs.version_note }}

Merging this PR will trigger the release pipeline."

