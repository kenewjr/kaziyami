name: Kaziyami Release Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build & verify with throwaway keystore, skip publish'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-repo
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false
          cache-overwrite-existing: true

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Generate Original Adaptive PNG Icons
        run: python tools/generate_icons.py

      - name: Validate Release Signing Secrets
        env:
          KAZIYAMI_KEYSTORE_B64: ${{ secrets.KAZIYAMI_KEYSTORE_B64 }}
          KAZIYAMI_KEYSTORE_PASSWORD: ${{ secrets.KAZIYAMI_KEYSTORE_PASSWORD }}
          KAZIYAMI_KEY_ALIAS: ${{ secrets.KAZIYAMI_KEY_ALIAS }}
          KAZIYAMI_KEY_PASSWORD: ${{ secrets.KAZIYAMI_KEY_PASSWORD }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          [ -z "$KAZIYAMI_KEYSTORE_B64" ] && missing+=("KAZIYAMI_KEYSTORE_B64")
          [ -z "$KAZIYAMI_KEYSTORE_PASSWORD" ] && missing+=("KAZIYAMI_KEYSTORE_PASSWORD")
          [ -z "$KAZIYAMI_KEY_ALIAS" ] && missing+=("KAZIYAMI_KEY_ALIAS")
          [ -z "$KAZIYAMI_KEY_PASSWORD" ] && missing+=("KAZIYAMI_KEY_PASSWORD")

          echo "=== Release Signing Secrets Audit ==="
          [ -n "$KAZIYAMI_KEYSTORE_B64" ] && echo "  - KAZIYAMI_KEYSTORE_B64: PRESENT" || echo "  - KAZIYAMI_KEYSTORE_B64: MISSING"
          [ -n "$KAZIYAMI_KEYSTORE_PASSWORD" ] && echo "  - KAZIYAMI_KEYSTORE_PASSWORD: PRESENT" || echo "  - KAZIYAMI_KEYSTORE_PASSWORD: MISSING"
          [ -n "$KAZIYAMI_KEY_ALIAS" ] && echo "  - KAZIYAMI_KEY_ALIAS: PRESENT" || echo "  - KAZIYAMI_KEY_ALIAS: MISSING"
          [ -n "$KAZIYAMI_KEY_PASSWORD" ] && echo "  - KAZIYAMI_KEY_PASSWORD: PRESENT" || echo "  - KAZIYAMI_KEY_PASSWORD: MISSING"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing ${#missing[@]} required signing secret(s): ${missing[*]}"
            echo "Hint: Secrets must be configured under Settings > Secrets and variables > Actions (repository secrets)."
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "::warning::Dry-run mode active: proceeding with ephemeral throwaway keystore."
            else
              exit 1
            fi
          else
            echo "All four release signing secrets are present."
          fi

      - name: Generate Throwaway Keystore (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          mkdir -p /tmp/keystore
          keytool -genkeypair -v \
            -keystore /tmp/keystore/dryrun.keystore \
            -alias dryrun \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dryrunpass \
            -keypass dryrunpass \
            -dname "CN=Kaziyami Ephemeral, OU=Kaziyami, O=Kaziyami, L=Tokyo, ST=Tokyo, C=JP"
          B64_KEYSTORE=$(base64 -w 0 /tmp/keystore/dryrun.keystore)
          echo "KAZIYAMI_KEYSTORE_B64=$B64_KEYSTORE" >> $GITHUB_ENV
          echo "KAZIYAMI_KEYSTORE_PASSWORD=dryrunpass" >> $GITHUB_ENV
          echo "KAZIYAMI_KEY_ALIAS=dryrun" >> $GITHUB_ENV
          echo "KAZIYAMI_KEY_PASSWORD=dryrunpass" >> $GITHUB_ENV

      - name: Run Test Verification Suite
        run: |
          ./gradlew check
          python tools/test_update_simulation.py
          python tools/test_preflight.py

      - name: Assemble Both Distribution Variants (APKs & JARs)
        env:
          KAZIYAMI_KEYSTORE_B64: ${{ env.KAZIYAMI_KEYSTORE_B64 || secrets.KAZIYAMI_KEYSTORE_B64 }}
          KAZIYAMI_KEYSTORE_PASSWORD: ${{ env.KAZIYAMI_KEYSTORE_PASSWORD || secrets.KAZIYAMI_KEYSTORE_PASSWORD }}
          KAZIYAMI_KEY_ALIAS: ${{ env.KAZIYAMI_KEY_ALIAS || secrets.KAZIYAMI_KEY_ALIAS }}
          KAZIYAMI_KEY_PASSWORD: ${{ env.KAZIYAMI_KEY_PASSWORD || secrets.KAZIYAMI_KEY_PASSWORD }}
        run: ./gradlew assembleAll

      - name: Verify Built Release APKs
        run: python tools/verify_apks.py ${{ inputs.dry_run && '--allow-debug-cert' || '' }}

      - name: Upload Artifacts (Dry Run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: kaziyami-dryrun-artifacts
          path: |
            repo/apk/*.apk
            repo/jar/*.jar
            repo/sha256sums.txt
            repo/jar/sha256sums.txt
          retention-days: 1

      - name: Deploy Repository Assets to repo Branch
        if: ${{ !inputs.dry_run }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: repo
          folder: repo
          single-commit: true
          commit-message: "deploy: publish Kaziyami extension & plugin release [skip ci]"

      - name: Verify Published Repository Assets Over HTTPS
        id: verify_published
        if: ${{ !inputs.dry_run }}
        run: python tools/verify_published_repo.py --repo "${{ github.repository }}" --branch repo --mode all --retries 10 --delay 6

      - name: Rollback Repository Index on Verification Failure
        if: ${{ failure() && steps.verify_published.outcome == 'failure' && !inputs.dry_run }}
        run: |
          echo "::error::Publish verification failed! Reverting repo branch index to previous commit..."
          git fetch origin repo
          git checkout origin/repo -- repo/index.json repo/index.min.json repo/repo.json repo/jar/index.json repo/jar/index.min.json repo/jar/repo.json || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "rollback: revert repository index due to asset verification failure [skip ci]" || true
          git push origin HEAD:repo || true

      - name: Extract Changelog Section
        id: changelog
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          python -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          pattern = r'## \[' + re.escape('$VERSION') + r'\].*?\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          notes = m.group(1).strip() if m else 'Kaziyami release $VERSION'
          with open('release_notes.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release for Tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            repo/apk/*.apk
            repo/jar/*.jar
            repo/sha256sums.txt
            repo/jar/sha256sums.txt
            repo/index.json
            repo/index.min.json
            repo/repo.json
            repo/jar/index.json
            repo/jar/index.min.json
            repo/jar/repo.json
          generate_release_notes: false

