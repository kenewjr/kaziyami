name: Kaziyami CI

on:
  push:
    branches: [ master, 'fix/**' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false
          cache-overwrite-existing: true

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Generate Extension Icons
        run: python tools/generate_icons.py

      - name: Generate Repository Index
        run: python tools/generate_repo_index.py

      - name: Check Extension Icons
        run: ./gradlew checkExtensionIcons

      - name: Run Build and Offline Tests with Coverage
        run: ./gradlew check jacocoTestReport --continue

      - name: Verify Test Counts and Execution Gates
        if: success() || failure()
        run: python tools/check_test_counts.py

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Verify Version Bumps on PR
        if: github.event_name == 'pull_request'
        run: python tools/bump_changed.py --check

      - name: Assemble Release APKs (Simulation / Unsigned)
        run: ./gradlew assembleRelease

      - name: Validate Index Schema and APK Manifest Integrity
        run: ./gradlew :core:test --tests "app.kaziyami.schema.IndexSchemaTest"

      - name: Verify Zero Network Identity Leaks
        run: ./gradlew :core:test --tests "app.kaziyami.network.NetworkLeakTest"

      - name: Scan Repository for Secrets and Tokens
        run: python tools/scan_secrets.py

  runtime-compat:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Validate Dependencies Against Host App Runtime Matrix
        run: python tools/verify_runtime_compat.py
